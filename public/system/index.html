<script>
  (function () {
    var token = null;
    try { token = window.localStorage.getItem('anqi-adminToken'); } catch (e) {}
    var path = window.location.pathname;
    if (!token && path.indexOf('/system/login') !== 0) {
      window.location.replace('/system/login');
    }
  })();
</script>
<style>
  /* 隐藏暂未提供的账号绑定入口 */
  span.site-info-item.action { display: none !important; }
  /* 隐藏侧边栏底部的外链区 */
  .ant-pro-sider-links { display: none !important; }
  /* 隐藏顶部帮助（问号）图标 */
  .ant-pro-global-header .ant-space-item > span.action:not(.account) { display: none !important; }
</style>
