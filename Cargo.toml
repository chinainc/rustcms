[workspace]
members = ["crates/ext"]
resolver = "2"

[package]
name = "rustcms"
version = "1.1.7"
edition = "2021"
description = "基于 Rust 的内容管理系统（CMS）"
license = "AGPL-3.0"
repository = "https://gitcode.com/yingnet/rustcms"
readme = "README.md"
keywords = ["cms", "rust", "axum", "sqlx", "mysql"]
categories = ["web-programming::http-server"]

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "signal", "sync"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["fs", "trace"] }
sqlx = { version = "0.7", default-features = false, features = [
    "mysql",
    "runtime-tokio-rustls",
    "chrono",
    "json",
    "macros",
] }
serde = { version = "1", features = ["derive"] }
# preserve_order：JSON 键按结构体字段顺序输出，便于与接口契约逐字段比对
serde_json = { version = "1", features = ["preserve_order"] }
tera = "1"
jsonwebtoken = "9"
bcrypt = "0.15"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
percent-encoding = "2"
md-5 = "0.10"
# 外部能力层（HTTP / SMTP / ZIP / 限流 / 表结构同步），不引入新依赖
rustcms-ext = { path = "crates/ext" }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
